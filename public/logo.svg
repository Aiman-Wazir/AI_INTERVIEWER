<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6c5ce7"/>
      <stop offset="50%" style="stop-color:#a29bfe"/>
      <stop offset="100%" style="stop-color:#fd79a8"/>
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#f0e8e0"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#6c5ce7" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="90" fill="url(#logoGrad)" filter="url(#shadow)"/>
  
  <!-- Chat Bubble -->
  <path d="M60 75 L60 130 L75 130 L75 145 L95 130 L140 130 L140 75 L60 75 Z" 
        fill="white" opacity="0.95"/>
  
  <!-- Sparkle/Star -->
  <g transform="translate(100, 100)">
    <!-- Main sparkle -->
    <path d="M0 -25 L5 -8 L22 -12 L10 2 L18 18 L0 10 L-18 18 L-10 2 L-22 -12 L-5 -8 Z" 
          fill="url(#sparkleGrad)" opacity="0.9"/>
    
    <!-- Small sparkle dots -->
    <circle cx="-30" cy="-30" r="4" fill="white" opacity="0.6"/>
    <circle cx="30" cy="-25" r="3" fill="white" opacity="0.5"/>
    <circle cx="-25" cy="30" r="3" fill="white" opacity="0.5"/>
    <circle cx="28" cy="28" r="4" fill="white" opacity="0.6"/>
  </g>
  
  <!-- "AI" Text -->
  <text x="100" y="158" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" 
        font-size="22" font-weight="700" fill="white" letter-spacing="1">
    AI
  </text>
</svg>